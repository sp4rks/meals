name: Deploy design prototype

on:
  push:
    branches: [main]
    paths:
      - design/**
      - .github/workflows/design-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the prototype
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload prototype
        uses: actions/upload-pages-artifact@v4
        with:
          path: design
      - name: Deploy prototype
        id: deployment
        uses: actions/deploy-pages@v4
